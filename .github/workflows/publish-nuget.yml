name: Publish NuGet tool

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PROJECT: src\common\Chore.Runner\Chore.Runner.csproj
      PACKAGE_OUTPUT: artifacts

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Read package version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            throw "Expected a version tag such as v1.2.3 or v1.2.3-beta.1."
          }
          "PACKAGE_VERSION=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore $env:PROJECT

      - name: Build
        run: dotnet build $env:PROJECT --configuration Release --no-restore -p:PackageVersion=$env:PACKAGE_VERSION

      - name: Pack .NET tool
        run: dotnet pack $env:PROJECT --configuration Release --no-build --output $env:PACKAGE_OUTPUT -p:PackageVersion=$env:PACKAGE_VERSION

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: Chore.Cli-${{ env.PACKAGE_VERSION }}
          path: artifacts\*.nupkg
          if-no-files-found: error

      - name: Authenticate to NuGet.org
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "NuGet trusted publishing did not return an API key."
          }
          dotnet nuget push "$env:PACKAGE_OUTPUT\*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
